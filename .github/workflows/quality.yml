name: Quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_URL: http://localhost:3000
      AUTH_RATE_LIMIT_SECRET: ci-only-auth-rate-limit-secret
      DATABASE_URL: postgresql://budget_buddy:budget_buddy@localhost:5432/budget_buddy
      DIRECT_URL: postgresql://budget_buddy:budget_buddy@localhost:5432/budget_buddy

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'prisma/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run ci
